name: Portfolio checks

on:
  push:
    branches: [main, redesign/portfolio-2026]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate source and build
        run: |
          npm run check
          npm run build
